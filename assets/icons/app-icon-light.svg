<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile-bg-light" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <linearGradient id="tile-rim-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="conduit-grad-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <radialGradient id="node-ambient-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <filter id="tile-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="rgba(15, 23, 42, 0.16)" />
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(15, 23, 42, 0.16)" />
    </filter>

    <filter id="route-depth-light" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="rgba(15, 23, 42, 0.22)" />
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="rgba(5, 150, 105, 0.18)" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile-bg-light)" filter="url(#tile-shadow-light)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.2" />
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" fill="none" stroke="url(#tile-rim-light)" stroke-width="1.5" />

  <g clip-path="url(#tile-clip-light)">
    <clipPath id="tile-clip-light">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
    <circle cx="680" cy="680" r="320" fill="url(#node-ambient-light)" />
    <ellipse cx="512" cy="160" rx="360" ry="100" fill="#FFFFFF" opacity="0.6" />
  </g>

  <g filter="url(#route-depth-light)">
    <!-- Standby Direct Route (Defined Slate-300 track for clear contrast) -->
    <path d="M 300 310 L 724 310" fill="none" stroke="#CBD5E1" stroke-width="64" stroke-linecap="round" />
    <path d="M 300 310 L 724 310" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

    <circle cx="724" cy="310" r="44" fill="#F1F5F9" stroke="#94A3B8" stroke-width="6" />
    <circle cx="724" cy="310" r="16" fill="#94A3B8" />

    <!-- Active Switched Tunnel Conduit -->
    <path d="M 300 310 C 560 310, 480 714, 724 714" fill="none" stroke="url(#conduit-grad-light)" stroke-width="84" stroke-linecap="round" />
    <path d="M 300 310 C 560 310, 480 714, 724 714" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.95" />

    <!-- Ingress Node -->
    <circle cx="300" cy="310" r="54" fill="#0F172A" stroke="#FFFFFF" stroke-width="8" />
    <circle cx="300" cy="310" r="22" fill="#38BDF8" />

    <!-- Active Egress Gateway Node -->
    <circle cx="724" cy="714" r="70" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="5" />
    <circle cx="724" cy="714" r="56" fill="#059669" stroke="#FFFFFF" stroke-width="8" />
    <circle cx="724" cy="714" r="28" fill="#10B981" />
    <circle cx="724" cy="714" r="12" fill="#FFFFFF" />
  </g>
</svg>