<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile-bg-dark" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#191C26" />
      <stop offset="45%" stop-color="#0F1118" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>

    <linearGradient id="tile-rim-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <linearGradient id="conduit-grad-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <radialGradient id="node-ambient-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <filter id="tile-shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="rgba(0, 0, 0, 0.65)" />
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(0, 0, 0, 0.65)" />
    </filter>

    <filter id="route-depth-dark" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="rgba(0, 0, 0, 0.6)" />
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="rgba(16, 185, 129, 0.3)" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile-bg-dark)" filter="url(#tile-shadow-dark)" />
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" fill="none" stroke="url(#tile-rim-dark)" stroke-width="1.5" />

  <g clip-path="url(#tile-clip-dark)">
    <clipPath id="tile-clip-dark">
      <rect x="100" y="100" width="824" height="824" rx="185" />
    </clipPath>
    <circle cx="680" cy="680" r="320" fill="url(#node-ambient-dark)" />
    <ellipse cx="512" cy="160" rx="360" ry="100" fill="#FFFFFF" opacity="0.035" />
  </g>

  <g filter="url(#route-depth-dark)">
    <!-- Standby Direct Route -->
    <path d="M 300 310 L 724 310" fill="none" stroke="#1E293B" stroke-width="64" stroke-linecap="round" />
    <path d="M 300 310 L 724 310" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

    <circle cx="724" cy="310" r="44" fill="#0F172A" stroke="#475569" stroke-width="6" />
    <circle cx="724" cy="310" r="16" fill="#475569" opacity="0.6" />

    <!-- Active Switched Tunnel Conduit -->
    <path d="M 300 310 C 560 310, 480 714, 724 714" fill="none" stroke="url(#conduit-grad-dark)" stroke-width="84" stroke-linecap="round" />
    <path d="M 300 310 C 560 310, 480 714, 724 714" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.9" />

    <!-- Ingress Node -->
    <circle cx="300" cy="310" r="54" fill="#0F172A" stroke="#38BDF8" stroke-width="8" />
    <circle cx="300" cy="310" r="22" fill="#F8FAFC" />

    <!-- Active Egress Gateway Node -->
    <circle cx="724" cy="714" r="70" fill="none" stroke="rgba(52, 211, 153, 0.4)" stroke-width="5" />
    <circle cx="724" cy="714" r="56" fill="#047857" stroke="#A7F3D0" stroke-width="8" />
    <circle cx="724" cy="714" r="28" fill="#10B981" />
    <circle cx="724" cy="714" r="12" fill="#FFFFFF" />
  </g>
</svg>